<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; url=frontend/index.html">
    <title>API-Culture</title>
    <link rel="icon" href="frontend/img/abeille_mascotte_final.png">
    <style>
        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #FCF9F2;
        }
        a { display: block; width: 100%; height: 100%; position: relative; }
        header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            padding: 20px 5%;
        }
        header img {
            width: min(500px, 100%, 70vh);
            height: auto;
            transform: translateY(10px);
        }
        .abeille, .trace {
            position: absolute;
            left: 50%;
            top: 58%;
        }
        .abeille {
            width: min(190px, 45vw, 40vh);
            transform: translate(-50%, -50%);
            will-change: transform;
        }
        .trace {
            width: 8px;
            height: 8px;
            margin: -4px;
            border-radius: 50%;
            background: #FAD265;
            animation: trace 1.8s ease-out forwards;
        }
        @keyframes trace { to { opacity: 0; transform: scale(0.2); } }
    </style>
</head>
<body>
    <a href="frontend/index.html" aria-label="Ouvrir API-Culture">
        <header>
            <img src="frontend/img/Accueil/logo_provisoire.png" alt="API-Culture">
        </header>
        <img class="abeille" src="frontend/img/abeille_mascotte_final.png" alt="Abeille d'API-Culture">
    </a>
    <script>
        var scene = document.querySelector("a");
        var abeille = document.querySelector(".abeille");
        var TOUR = 7000;
        var sens = 1, debut = null, dernierPoint = 0;

        function voler(temps) {
            if (debut === null) debut = temps;
            var t = (temps - debut) / TOUR * 2 * Math.PI;
            var x = Math.sin(t) * Math.min(window.innerWidth * 0.22, 180);
            var y = Math.sin(2 * t) * Math.min(window.innerHeight * 0.08, 35);
            var cap = Math.cos(t) >= 0 ? 1 : -1;
            sens += (cap - sens) * 0.07;

            abeille.style.transform = "translate(calc(-50% + " + x + "px), calc(-50% + " + y + "px))"
                + " scaleX(" + sens + ") rotate(" + (Math.cos(2 * t) * 5) + "deg)";

            if (temps - dernierPoint > 140) {
                var largeur = abeille.offsetWidth;
                poser(x - sens * largeur * 0.45, y + largeur * 0.08);
                dernierPoint = temps;
            }
            requestAnimationFrame(voler);
        }

        function poser(x, y) {
            var point = document.createElement("span");
            point.className = "trace";
            point.style.marginLeft = (x - 4) + "px";
            point.style.marginTop = (y - 4) + "px";
            scene.insertBefore(point, abeille);
            setTimeout(function () { point.remove(); }, 1800);
        }

        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            requestAnimationFrame(voler);
        }
        setTimeout(function () { location.replace("frontend/index.html"); }, 3500);
    </script>
</body>
</html>
